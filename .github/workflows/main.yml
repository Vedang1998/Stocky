name: Claude comment trigger

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  ingress:
    if: >-
      github.repository == 'Vedang1998/Stocky' &&
      github.event.comment.user.login == 'Vedang1998' &&
      github.event.comment.user.id == 278831488 &&
      github.event.comment.user.type == 'User' &&
      startsWith(github.event.comment.body, '@claude ')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read

    outputs:
      mode: ${{ steps.dispatch.outputs.mode }}
      invoke_claude: ${{ steps.dispatch.outputs.invoke_claude }}
      admitted: ${{ steps.dispatch.outputs.admitted }}

    env:
      STOCKY_REVIEW_RUNNER_ACTIVATED: ${{ vars.STOCKY_CLAUDE_REVIEW_RUNNER }}

    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Pin npm
        run: npm install -g npm@11.5.2

      - name: Verify Node and npm
        run: |
          node --version
          test "$(node --version)" = "v22.19.0"
          npm --version
          test "$(npm --version)" = "11.5.2"

      - name: Validate work order
        id: dispatch
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ACTOR_LOGIN: ${{ github.event.comment.user.login }}
          ACTOR_ID: ${{ github.event.comment.user.id }}
          ACTOR_TYPE: ${{ github.event.comment.user.type }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          STOCKY_REVIEW_STATE_DIR: ${{ runner.temp }}/stocky-review
        run: node .github/scripts/claude-review/bin/dispatch.mjs --phase validate

      - name: Upload trusted state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stocky-review-state-${{ github.run_id }}
          path: ${{ runner.temp }}/stocky-review
          if-no-files-found: error
          retention-days: 1

  simple:
    needs: ingress
    if: needs.ingress.outputs.invoke_claude == 'true' && needs.ingress.outputs.mode == 'simple'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download trusted state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stocky-review-state-${{ github.run_id }}
          path: ${{ runner.temp }}/stocky-review

      - name: Load prompt
        id: prompt
        env:
          STOCKY_REVIEW_STATE_DIR: ${{ runner.temp }}/stocky-review
        run: |
          {
            echo "prompt<<STOCKY_PROMPT_EOF"
            cat "${STOCKY_REVIEW_STATE_DIR}/prompt.txt"
            echo "STOCKY_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (simple communication)
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          additional_permissions: "actions: read"
          show_full_output: false
          classify_inline_comments: false
          use_sticky_comment: false
          include_fix_links: false
          settings: .github/scripts/claude-review/settings/simple-route.json
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --permission-mode dontAsk
            --allowedTools Read,Glob,Grep,LS
            --disallowedTools Bash,BashOutput,KillShell,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,SlashCommand

  executable:
    needs: ingress
    if: needs.ingress.outputs.invoke_claude == 'true' && needs.ingress.outputs.mode == 'executable_review'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download trusted state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stocky-review-state-${{ github.run_id }}
          path: ${{ runner.temp }}/stocky-review

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Pin npm
        run: npm install -g npm@11.5.2

      - name: Rewrite MCP config for this job
        env:
          STOCKY_REVIEW_STATE_DIR: ${{ runner.temp }}/stocky-review
        run: node .github/scripts/claude-review/bin/dispatch.mjs --phase rewrite-mcp

      - name: Load prompt
        id: prompt
        env:
          STOCKY_REVIEW_STATE_DIR: ${{ runner.temp }}/stocky-review
        run: |
          {
            echo "prompt<<STOCKY_PROMPT_EOF"
            cat "${STOCKY_REVIEW_STATE_DIR}/prompt.txt"
            echo "STOCKY_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (executable review)
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: false
          classify_inline_comments: false
          use_sticky_comment: false
          include_fix_links: false
          settings: .github/scripts/claude-review/settings/executable-review.json
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --permission-mode dontAsk
            --allowedTools mcp__stocky_review__get_evidence,mcp__stocky_review__read_subject,mcp__stocky_review__run_probe,mcp__stocky_review__checkpoint
            --disallowedTools Bash,BashOutput,KillShell,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,SlashCommand
            --mcp-config ${{ runner.temp }}/stocky-review/mcp.json

      - name: Collect trusted executor results
        if: always()
        env:
          STOCKY_REVIEW_STATE_DIR: ${{ runner.temp }}/stocky-review
        run: node .github/scripts/claude-review/bin/dispatch.mjs --phase collect-executor

      - name: Upload publisher input
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stocky-review-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/stocky-review
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ingress, executable]
    if: always() && needs.ingress.outputs.invoke_claude == 'true' && needs.ingress.outputs.mode == 'executable_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download publisher input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stocky-review-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/stocky-review

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Trusted publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STOCKY_REVIEW_STATE_DIR: ${{ runner.temp }}/stocky-review
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STOCKY_PUBLISH_REPO_DIR: ${{ github.workspace }}
        run: node .github/scripts/claude-review/bin/dispatch.mjs --phase publish-from-state

  publish_reject:
    needs: ingress
    if: always() && needs.ingress.outputs.invoke_claude != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download trusted state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stocky-review-state-${{ github.run_id }}
          path: ${{ runner.temp }}/stocky-review

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Publish rejection or stop without model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STOCKY_REVIEW_STATE_DIR: ${{ runner.temp }}/stocky-review
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/claude-review/bin/dispatch.mjs --phase publish-reject
