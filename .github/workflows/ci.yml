name: CI

on:
  push:
    branches: [main, "phase-1/**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: stocky-plus

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, build, Prisma, GraphQL
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocky
          POSTGRES_PASSWORD: stocky
          POSTGRES_DB: stocky_plus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocky -d stocky_plus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only placeholders — no real Shopify credentials or merchant data.
      NODE_ENV: test
      DATABASE_URL: postgresql://stocky:stocky@localhost:5432/stocky_plus_ci
      DATABASE_MIGRATION_URL: postgresql://stocky:stocky@localhost:5432/stocky_plus_ci
      TENANT_MAINTENANCE_DATABASE_URL: postgresql://stocky:stocky@localhost:5432/stocky_plus_ci
      # Provisioned by tenant:roles:provision (test-only password).
      DATABASE_RUNTIME_URL: postgresql://stocky_runtime:stocky_runtime_ci_only@localhost:5432/stocky_plus_ci  # pragma: allowlist secret
      STOCKY_RUNTIME_ROLE: stocky_runtime
      STOCKY_RUNTIME_ROLE_PASSWORD: stocky_runtime_ci_only  # pragma: allowlist secret
      STOCKY_CONTROL_PLANE_ROLE_PASSWORD: stocky_control_plane_ci_only  # pragma: allowlist secret
      DATABASE_CONTROL_PLANE_URL: postgresql://stocky_control_plane:stocky_control_plane_ci_only@localhost:5432/stocky_plus_ci  # pragma: allowlist secret
      STOCKY_ALLOW_CONTROL_PLANE_URL_FALLBACK: "1"
      STOCKY_BOOTSTRAP_DATABASE_URL: postgresql://stocky:stocky@localhost:5432/stocky_plus_ci  # pragma: allowlist secret
      STOCKY_REQUIRE_RUNTIME_DB_URL: "0"
      REDIS_URL: redis://localhost:6379
      # Test-only envelope secret (≥32 bytes). Never a production secret.
      TENANT_JOB_ENVELOPE_SECRET: "ci-test-only-tenant-job-envelope-secret-32b!"  # pragma: allowlist secret
      SHOPIFY_API_KEY: ci-test-api-key
      SHOPIFY_API_SECRET: ci-test-api-secret
      SCOPES: read_products,write_products,read_inventory,write_inventory,read_orders,read_locations
      SHOPIFY_APP_URL: https://example.com
      FEATURE_STOCKTAKE_INVENTORY_WRITES: "false"
      FEATURE_ADJUSTMENT_WRITES: "false"
      FEATURE_RECEIPT_WRITES: "false"
      FEATURE_COST_SYNC: "false"
      FEATURE_TRANSFER_WRITES: "false"
      ALLOW_DEV_SUBSCRIPTION_ACTIVATE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: stocky-plus/package-lock.json

      # Match package.json "packageManager" / engines.npm — same version used
      # to repair the lockfile and for local validation evidence.
      - name: Pin npm
        working-directory: .
        run: npm install -g npm@11.5.2

      - name: Verify Node and npm versions
        working-directory: .
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "11.5.2"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to ephemeral PostgreSQL
        run: npx prisma migrate deploy

      - name: Compatibility index apply
        run: npm run tenant:indexes:apply -- --apply
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Compatibility index verify
        run: npm run tenant:indexes:verify

      - name: Prisma schema drift check
        run: npm run tenant:schema:drift

      - name: Post-apply index plan (all valid_exact)
        run: |
          npm run tenant:indexes:plan
        # plan exits 0 when all indexes are valid_exact

      - name: Tenant enforcement inventory freshness
        run: npm run tenant:enforcement:inventory:check

      - name: Tenant database role provisioning
        run: npm run tenant:roles:provision -- --apply
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant enforcement preflight
        run: npm run tenant:enforcement:preflight
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant enforcement apply
        run: npm run tenant:enforcement:apply -- --apply
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant database role verification
        run: npm run tenant:roles:verify
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant RLS policy verification
        run: npm run tenant:rls:verify
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant immutability verification
        run: npm run tenant:immutability:verify
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant composite constraint verification
        run: npm run tenant:enforcement:verify
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant enforcement drift verification
        run: npm run tenant:enforcement:drift
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant pooled-connection isolation tests
        run: npm run test:db-isolation -- app/tenant/__tests__/db-isolation/isolation.test.ts

      - name: Tenant database isolation full suite
        run: npm run test:db-isolation

      - name: Tenant low-lock enforcement migration tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/enforcement.migration.test.ts

      - name: Tenant RLS definition-drift tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/definition-drift.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant composite-definition drift tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/composite-definition-drift.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant immutability-trigger drift tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/immutability-trigger-drift.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant unsafe partial-apply recovery tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/partial-apply-recovery.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant enforcement interruption/resume tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/partial-apply-recovery.test.ts -t "interrupt after|resume preflight"
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant deadlock-timeout-cancellation recovery tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/deadlock-timeout-recovery.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant role-membership escalation tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/role-membership.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant exact privilege allowlist tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/exact-privilege-allowlist.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant exact privilege complete-matrix tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/exact-privilege-complete-matrix.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant sequence privilege tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/sequence-privilege.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant default-privilege drift tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/default-privilege-drift.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant verifier read-only tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/verifier-readonly.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant runtime connected-identity tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/connected-identity.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant runtime connected-identity application tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/runtime-connected-identity-app.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant resume-preflight corrected-state drift tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/resume-preflight-drift.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant catalog qualification tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/catalog-qualification.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant advisory-unlock failure tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/advisory-unlock-failure.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant populated runtime-traffic concurrency tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/populated-concurrency.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant non-superuser migration-owner full enforcement
        run: |
          set -euo pipefail
          echo "Bootstrapping non-superuser CREATEROLE migration owner attributes..."
          PGPASSWORD=stocky psql -h localhost -U stocky -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'stocky_mig_ci') THEN
              CREATE ROLE stocky_mig_ci LOGIN PASSWORD 'stocky_mig_ci_only' NOSUPERUSER NOCREATEDB CREATEROLE NOBYPASSRLS NOINHERIT;
            END IF;
          END$$;
          SQL
          ATTRS=$(PGPASSWORD=stocky psql -h localhost -U stocky -d postgres -Atc "SELECT rolsuper::text||','||rolbypassrls::text||','||rolcreaterole::text||','||rolcreatedb::text FROM pg_roles WHERE rolname='stocky_mig_ci'")
          echo "migration_owner.attrs=$ATTRS"
          # psql -Atc emits boolean::text as true/false (not f/t).
          test "$ATTRS" = "false,false,true,false"
          echo "migration_owner.rolsuper = false"
          echo "migration_owner.rolbypassrls = false"
          echo "migration_owner.rolcreaterole = true"
          echo "migration_owner.rolcreatedb = false"
          npm run test:migrations -- scripts/tenant-enforcement/tests/non-superuser-migration-owner.test.ts
        env:
          STOCKY_BOOTSTRAP_DATABASE_URL: ${{ env.STOCKY_BOOTSTRAP_DATABASE_URL }}
          STOCKY_RUNTIME_ROLE_PASSWORD: ${{ env.STOCKY_RUNTIME_ROLE_PASSWORD }}

      - name: Tenant future-function default-privilege tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/future-function-default-privilege.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant populated merchant-error classification tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/merchant-error-classification.test.ts

      - name: Tenant PostgreSQL role-creator membership tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/role-creator-membership.test.ts
        env:
          STOCKY_BOOTSTRAP_DATABASE_URL: ${{ env.STOCKY_BOOTSTRAP_DATABASE_URL }}
          STOCKY_RUNTIME_ROLE_PASSWORD: ${{ env.STOCKY_RUNTIME_ROLE_PASSWORD }}

      - name: Tenant catalog qualification follow-up tests
        run: npm run test:migrations -- scripts/tenant-enforcement/tests/catalog-qualification-followup.test.ts
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Tenant access architecture audit
        run: npm run tenant:access:audit

      - name: Tenant access inventory freshness
        run: npm run tenant:access:inventory:check

      - name: Sync control-plane inventory freshness
        run: npm run sync:inventory:check

      - name: Sync control-plane role provisioning
        run: npm run sync:roles:provision -- --apply
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}
          STOCKY_CONTROL_PLANE_ROLE_PASSWORD: stocky_control_plane_ci_only

      - name: Sync control-plane role verification
        run: npm run sync:roles:verify
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.DATABASE_URL }}

      - name: Sync control-plane integration tests
        run: npm run test:sync-integration

      - name: Sync exactly-once application (F-PR4-01 / NEW-PR4-C03)
        run: npm run test:sync-exactly-once

      - name: "NEW-PR4-C01: retained failed BullMQ dispatch must not false-ENQUEUE"
        run: npm run test:sync-dispatch-recovery -- -t "retained FAILED queue job must not leave durable ENQUEUED"

      - name: "NEW-PR4-C01: retained completed BullMQ dispatch"
        run: npm run test:sync-dispatch-recovery -- -t "retained completed deterministic queue job"

      - name: "NEW-PR4-C01: acknowledgement denied without runnable job"
        run: npm run test:sync-dispatch-recovery -- -t "acknowledgement denied without runnable job"

      - name: "NEW-PR4-C01: stranded ENQUEUED recovery"
        run: npm run test:sync-dispatch-recovery -- -t "stranded ENQUEUED recovery"

      - name: "NEW-PR4-C01: unknown queue state fails closed"
        run: npm run test:sync-dispatch-recovery -- -t "existing unknown queue state does not create another dispatch sequence"

      - name: "NEW-PR4-C01: queue outage does not duplicate dispatch"
        run: npm run test:sync-dispatch-recovery -- -t "Redis outage cannot create duplicate dispatches"

      - name: "NEW-PR4-C01: non-retryable stranded job dead-letters"
        run: npm run test:sync-dispatch-recovery -- -t "NO_AUTOMATIC_RETRY stranded job dead-letters"

      - name: "NEW-PR4-C01: max-attempt stranded job dead-letters"
        run: npm run test:sync-dispatch-recovery -- -t "max-attempt stranded job dead-letters"

      - name: "NEW-PR4-SC01: matching receipt verified after rollback"
        run: npm run test:sync-exactly-once -- -t "matching receipt verified after rollback"

      - name: "NEW-PR4-SC01: missing receipt dead-letters uncertain"
        run: npm run test:sync-exactly-once -- -t "missing receipt dead-letters uncertain"

      - name: "NEW-PR4-SC01: digest mismatch dead-letters conflict"
        run: npm run test:sync-exactly-once -- -t "digest mismatch dead-letters conflict"

      - name: "NEW-CLAUDE-D045-02: v3 worker verified-after-rollback"
        run: npm run test:sync-exactly-once -- -t "NEW-CLAUDE-D045-02: v3 worker verified-after-rollback"

      - name: "NEW-CLAUDE-D045-02: v2 worker verified-after-rollback"
        run: npm run test:sync-exactly-once -- -t "NEW-CLAUDE-D045-02: v2 worker verified-after-rollback"

      - name: "NEW-CLAUDE-D045-02: worker digest-conflict dead-letter"
        run: npm run test:sync-exactly-once -- -t "NEW-CLAUDE-D045-02: worker digest-conflict dead-letter"

      - name: "NEW-CLAUDE-D045-02: worker uncertain-outcome dead-letter"
        run: npm run test:sync-exactly-once -- -t "NEW-CLAUDE-D045-02: worker uncertain-outcome dead-letter"

      - name: "NEW-CLAUDE-D045-02: RepeatableRead transaction option"
        run: npm run test:sync-exactly-once -- -t "NEW-CLAUDE-D045-02: RepeatableRead transaction option"

      - name: "NEW-CLAUDE-D045-01: queue classification seam absent"
        run: npm run test:sync-final-correction -- -t "production queue-presence exports no classification seam"

      - name: "NEW-PR4-SC02: production ignores Redis test timeout"
        run: npm run test:sync-final-correction -- -t "production ignores Redis test timeout"

      - name: "NEW-PR4-SC03: indeterminate evidence deduplicates"
        run: npm run test:sync-final-correction -- -t "indeterminate evidence deduplicates"

      - name: "NEW-PR4-SC04: nullable selectors fail closed"
        run: npm run test:sync-final-correction -- -t "nullable activeDispatchSequence fails closed"

      - name: "NEW-PR4-SC05: terminal transition result required"
        run: npm run test:sync-final-correction -- -t "terminal transition result required"

      - name: "NEW-PR4-SC06: BullMQ runnable-state compatibility"
        run: npm run test:sync-final-correction -- -t "BullMQ runnable-state allowlist excludes paused"

      - name: "NEW-PR4-SC08: stranded recovery budget is bounded"
        run: npm run test:sync-final-correction -- -t "stranded recovery budget increments"

      - name: Sync dispatch recovery (full suite)
        run: npm run test:sync-dispatch-recovery

      - name: Sync final correction suite (D-045)
        run: npm run test:sync-final-correction

      - name: Sync uninstall cancel (F-PR4-03)
        run: npm run test:sync-uninstall

      - name: "NEW-PR4-C02: nullable webhook delivery in attempt reaper"
        run: npm run test:sync-attempt-recovery -- -t "nullable webhook delivery identity"

      - name: "NEW-PR4-C02: poison-row batch isolation"
        run: npm run test:sync-attempt-recovery -- -t "poison NULL webhookDeliveryId"

      - name: Sync attempt recovery (full suite / NEW-PR4-C03)
        run: npm run test:sync-attempt-recovery

      - name: "NEW-PR4-C04: envelope v1/v2 fail-closed"
        run: npm run test:sync-envelope-fail-closed

      - name: "NEW-PR4-C06: completeAttemptFail always dead-letters"
        run: npm run test:sync-attempt-recovery -- -t "completeAttemptFail always dead-letters"

      - name: Sync role isolation (F-PR4-06 / NEW-PR4-C08)
        run: npm run test:sync-role-isolation

      - name: "NEW-PR4-C08: restricted receipt-probe function ownership"
        run: npm run test:sync-role-isolation -- -t "stocky_has_application_receipt owner is restricted"

      - name: Sync inventory audit (F-PR4-07)
        run: npm run test:sync-inventory-audit

      - name: Sync dispatch performance/fairness (F-PR4-11/13)
        run: npm run test:sync-performance
        env:
          SYNC_PERF_JOB_COUNT: "50000"
          STOCKY_ALLOW_CONTROL_PLANE_URL_FALLBACK: "1"
          DATABASE_CONTROL_PLANE_URL: postgresql://stocky_control_plane:stocky_control_plane_ci_only@localhost:5432/stocky_plus_ci

      - name: Tenant access PostgreSQL tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nullable-ownership.test.ts app/tenant/__tests__/tenant-db.test.ts app/tenant/__tests__/bootstrap.test.ts

      - name: Tenant relation isolation tests
        run: npm run test:tenant-access -- app/tenant/__tests__/relation-isolation.test.ts

      - name: Tenant job-envelope integrity tests
        run: npm run test:tenant-access -- app/tenant/__tests__/job-envelope.test.ts

      - name: Tenant queue/Redis tests
        run: npm run test:tenant-access -- app/tenant/__tests__/queue-redis.test.ts
        env:
          STOCKY_ALLOW_CONTROL_PLANE_URL_FALLBACK: "1"
          DATABASE_CONTROL_PLANE_URL: postgresql://stocky_control_plane:stocky_control_plane_ci_only@localhost:5432/stocky_plus_ci

      - name: Client authority denial tests
        run: npm run test:tenant-access -- app/tenant/__tests__/client-hints.test.ts app/tenant/__tests__/authority.test.ts

      - name: Nested write ownership tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-writes.test.ts

      - name: Tenant nested selector authorization tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-selector-auth.test.ts

      - name: Tenant connectOrCreate foreign-match tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-selector-auth.test.ts app/tenant/__tests__/connect-or-create-merge.test.ts

      - name: Tenant array nested-mutation tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-selector-auth.test.ts

      - name: Tenant legacy normalization read consistency tests
        run: npm run test:tenant-access -- app/tenant/__tests__/normalization-consistency.test.ts app/tenant/__tests__/legacy-normalization.test.ts

      - name: Tenant legacy SQL/JS normalization equivalence tests
        run: npm run test:tenant-access -- app/tenant/__tests__/legacy-normalization-equivalence.test.ts

      - name: Tenant legacy bulk-mutation consistency tests
        run: npm run test:tenant-access -- app/tenant/__tests__/legacy-normalization-bulk-mutations.test.ts

      - name: Tenant legacy relation consistency tests
        run: npm run test:tenant-access -- app/tenant/__tests__/legacy-normalization-relations.test.ts

      - name: Tenant legacy-evidence overflow tests
        run: npm run test:tenant-access -- app/tenant/__tests__/legacy-evidence-overflow.test.ts

      - name: Tenant legacy unique-selector resolution tests
        run: npm run test:tenant-access -- app/tenant/__tests__/legacy-unique-selector-resolution.test.ts

      - name: Tenant legacy evidence configuration tests
