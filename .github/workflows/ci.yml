name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: stocky-plus

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, build, Prisma, GraphQL
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocky
          POSTGRES_PASSWORD: stocky
          POSTGRES_DB: stocky_plus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocky -d stocky_plus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only placeholders — no real Shopify credentials or merchant data.
      NODE_ENV: test
      DATABASE_URL: postgresql://stocky:stocky@localhost:5432/stocky_plus_ci
      TENANT_MAINTENANCE_DATABASE_URL: postgresql://stocky:stocky@localhost:5432/stocky_plus_ci
      REDIS_URL: redis://localhost:6379
      # Test-only envelope secret (≥32 bytes). Never a production secret.
      TENANT_JOB_ENVELOPE_SECRET: "ci-test-only-tenant-job-envelope-secret-32b!"
      SHOPIFY_API_KEY: ci-test-api-key
      SHOPIFY_API_SECRET: ci-test-api-secret
      SCOPES: read_products,write_products,read_inventory,write_inventory,read_orders,read_locations
      SHOPIFY_APP_URL: https://example.com
      FEATURE_STOCKTAKE_INVENTORY_WRITES: "false"
      FEATURE_ADJUSTMENT_WRITES: "false"
      FEATURE_RECEIPT_WRITES: "false"
      FEATURE_COST_SYNC: "false"
      FEATURE_TRANSFER_WRITES: "false"
      ALLOW_DEV_SUBSCRIPTION_ACTIVATE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: stocky-plus/package-lock.json

      # Match package.json "packageManager" / engines.npm — same version used
      # to repair the lockfile and for local validation evidence.
      - name: Pin npm
        working-directory: .
        run: npm install -g npm@11.5.2

      - name: Verify Node and npm versions
        working-directory: .
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "11.5.2"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to ephemeral PostgreSQL
        run: npx prisma migrate deploy

      - name: Compatibility index apply
        run: npm run tenant:indexes:apply -- --apply
        env:
          TENANT_MAINTENANCE_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Compatibility index verify
        run: npm run tenant:indexes:verify

      - name: Prisma schema drift check
        run: npm run tenant:schema:drift

      - name: Post-apply index plan (all valid_exact)
        run: |
          npm run tenant:indexes:plan
        # plan exits 0 when all indexes are valid_exact

      - name: Tenant access architecture audit
        run: npm run tenant:access:audit

      - name: Tenant access inventory freshness
        run: npm run tenant:access:inventory:check

      - name: Tenant access PostgreSQL tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nullable-ownership.test.ts app/tenant/__tests__/tenant-db.test.ts app/tenant/__tests__/bootstrap.test.ts

      - name: Tenant relation isolation tests
        run: npm run test:tenant-access -- app/tenant/__tests__/relation-isolation.test.ts

      - name: Tenant job-envelope integrity tests
        run: npm run test:tenant-access -- app/tenant/__tests__/job-envelope.test.ts

      - name: Tenant queue/Redis tests
        run: npm run test:tenant-access -- app/tenant/__tests__/queue-redis.test.ts

      - name: Client authority denial tests
        run: npm run test:tenant-access -- app/tenant/__tests__/client-hints.test.ts app/tenant/__tests__/authority.test.ts

      - name: Nested write ownership tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-writes.test.ts

      - name: Tenant nested selector authorization tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-selector-auth.test.ts

      - name: Tenant connectOrCreate foreign-match tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-selector-auth.test.ts app/tenant/__tests__/connect-or-create-merge.test.ts

      - name: Tenant array nested-mutation tests
        run: npm run test:tenant-access -- app/tenant/__tests__/nested-selector-auth.test.ts

      - name: Tenant legacy normalization compatibility tests
        run: npm run test:tenant-access -- app/tenant/__tests__/legacy-normalization.test.ts app/tenant/__tests__/normalization-consistency.test.ts

      - name: Tenant partial-selection tests
        run: npm run test:tenant-access -- app/tenant/__tests__/partial-select-update.test.ts

      - name: Tenant update projection and nested-write tests
        run: npm run test:tenant-access -- app/tenant/__tests__/partial-select-update.test.ts

      - name: Tenant scanner provenance tests
        run: npm run test:tenant-access -- scripts/tenant-access/architecture-audit.test.ts

      - name: Tenant large-payload client-hint tests
        run: npm run test:tenant-access -- app/tenant/__tests__/large-payload-hints.test.ts

      - name: Tenant write atomicity tests
        run: npm run test:tenant-access -- app/tenant/__tests__/write-atomicity.test.ts

      - name: Tenant top-level unique-selector tests
        run: npm run test:tenant-access -- app/tenant/__tests__/top-level-unique-selectors.test.ts

      - name: Tenant scope scale tests
        run: npm run test:tenant-access -- app/tenant/__tests__/tenant-scope-scale.test.ts

      - name: Tenant mixed relation ownership tests
        run: npm run test:tenant-access -- app/tenant/__tests__/mixed-relation-ownership.test.ts

      - name: Tenant connectOrCreate merge tests
        run: npm run test:tenant-access -- app/tenant/__tests__/connect-or-create-merge.test.ts

      - name: Tenant normalization consistency tests
        run: npm run test:tenant-access -- app/tenant/__tests__/normalization-consistency.test.ts

      - name: Tenant LeadTimeSnapshot projection tests
        run: npm run test:tenant-access -- app/tenant/__tests__/lead-time-partial-select.test.ts

      - name: Tenant request-byte and shop-hint tests
        run: npm run test:tenant-access -- app/tenant/__tests__/client-hint-byte-limits.test.ts

      - name: Tenant authority-issuer scanner tests
        run: npm run test:tenant-access -- scripts/tenant-access/__tests__/authority-issuer-scanner.test.ts

      - name: Tenant access architecture negative fixtures
        run: npm run test:tenant-access -- scripts/tenant-access/architecture-audit.test.ts

      - name: Tenant access tests
        run: npm run test:tenant-access

      - name: Git diff check
        run: git diff --check
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migration and tenant-backfill tests
        run: npm run test:migrations

      - name: Constrained-memory subject evidence
        run: npm run test:subject-memory

      - name: Build
        run: npm run build

      # Requires outbound HTTPS to shopify.dev to fetch the Admin GraphQL schema.
      - name: GraphQL codegen / schema validation
        run: npm run graphql-codegen
