name: Claude review isolated executor

# Secret-free isolation proof and provenance-bound operator replay.
# This workflow is NOT the comment-ingress controller and does not receive
# CLAUDE_CODE_OAUTH_TOKEN. MCP run_probe uses lib/isolated-executor.js; this
# workflow calls the same executor. workflow_dispatch without provenance fails.
# No pull_request_target, no workflow_run.

on:
  pull_request:
    paths:
      - ".github/workflows/claude-review-execution.yml"
      - ".github/workflows/main.yml"
      - ".github/scripts/claude-review/**"
  workflow_dispatch:
    inputs:
      subject_head:
        description: "Full 40-hex subject HEAD (required provenance)"
        required: true
      subject_base:
        description: "Full 40-hex subject BASE"
        required: true
      task_id:
        description: "Admitted task_id"
        required: true
      attempt:
        description: "Lease attempt id"
        required: true
      authority_comment_id:
        description: "Authority comment numeric id"
        required: true
      dispatch_key:
        description: "Dispatch-key bound to the task"
        required: true
      probe_kind:
        description: "sql | redis | node_script | zero_test_control"
        required: true
        default: "sql"
      probe_sql:
        description: "Single allowlisted SQL statement when kind=sql"
        required: false
        default: "SELECT 1 AS ok"
      max_sandbox_seconds:
        description: "Per-probe ceiling (max 1200)"
        required: false
        default: "60"

permissions: {}

jobs:
  isolation_proof:
    if: github.repository == 'Vedang1998/Stocky' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout PR head as data (read-only credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Pin npm
        run: npm install -g npm@11.5.2

      - name: Isolated executor proof
        env:
          SUBJECT_HEAD: ${{ github.event.pull_request.head.sha }}
          SUBJECT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/claude-review/bin/isolation-proof.mjs

  operator_replay:
    if: >-
      github.repository == 'Vedang1998/Stocky' &&
      github.event_name == 'workflow_dispatch' &&
      vars.STOCKY_CLAUDE_REVIEW_RUNNER == 'admitted'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow ref (never the untrusted subject SHA)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Pin npm
        run: npm install -g npm@11.5.2

      - name: Provenance-bound isolated probe
        env:
          SUBJECT_HEAD: ${{ inputs.subject_head }}
          SUBJECT_BASE: ${{ inputs.subject_base }}
          TASK_ID: ${{ inputs.task_id }}
          ATTEMPT: ${{ inputs.attempt }}
          AUTHORITY_COMMENT_ID: ${{ inputs.authority_comment_id }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          PROBE_KIND: ${{ inputs.probe_kind }}
          PROBE_SQL: ${{ inputs.probe_sql }}
          PROBE_TIMEOUT: ${{ inputs.max_sandbox_seconds }}
        run: node .github/scripts/claude-review/bin/sandbox.mjs --require-provenance
