# Working title — public product name pending product-owner decision (F-131).
# Do not use Stocky / Stocky++ or first-party Shopify impersonation in merchant-facing copy.

client_id = ""

[access_scopes]
# Merchant-managed fulfillment scopes removed in Phase 0 — no approved fulfillment workflow.
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders,read_locations"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds/create"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete"]
  uri = "/webhooks/catalog-facts"

  [[webhooks.subscriptions]]
  topics = ["inventory_items/create", "inventory_items/update", "inventory_items/delete"]
  uri = "/webhooks/catalog-facts"

  [[webhooks.subscriptions]]
  topics = ["inventory_levels/connect", "inventory_levels/update", "inventory_levels/disconnect"]
  uri = "/webhooks/catalog-facts"

  [[webhooks.subscriptions]]
  topics = ["locations/create", "locations/update", "locations/delete", "locations/activate", "locations/deactivate"]
  uri = "/webhooks/catalog-facts"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "/webhooks/catalog-facts"

  # Mandatory App Store compliance webhooks (https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance)
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[build]
automatically_update_urls_on_dev = true
